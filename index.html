<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1008">
<title>中国象棋 · 楚河汉界</title>
<style>
/* ============ 基础变量 ============ */
:root{
  --cell: 62px;
  --pad: 0.66;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Kaiti SC", "STKaiti", KaiTi, "Kai", "Songti SC", "STSong", "Noto Serif SC", serif;
  --gold: #d8b265;
  --gold-dim: #9c8148;
  --ink: #241508;
  --wood-line: rgba(74,43,16,.78);
  --red-pc: #b3161c;
  --blk-pc: #1d2630;
  --robe: #3f5d86;
  --robe-d: #2d4463;
  --robe-l: #51739f;
  --skin: #efc9a4;
  --skin-d: #d9a97f;
  --hair: #2a2220;
  --noise: none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:var(--ui);
  color:#ecdfc6;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#120b06;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* 房间与桌面 */
#room{
  position:absolute;inset:0;
  background:
    radial-gradient(130% 80% at 50% -10%, rgba(255,214,150,.20) 0%, rgba(120,76,36,.10) 38%, rgba(0,0,0,0) 62%),
    linear-gradient(#2b1d12 0%, #22160d 42%, #140d07 100%);
}
#room:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 85% at 50% 42%, rgba(0,0,0,0) 48%, rgba(0,0,0,.55) 100%);
}
#room:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:var(--noise);background-size:160px 160px;
  mix-blend-mode:overlay;
}
/* ============ 总布局 ============ */
#app{
  position:absolute;inset:0;display:grid;
  grid-template-columns:1fr 310px;
  grid-template-rows:100%;
}
#stage{
  position:relative;display:flex;flex-direction:column;
  min-width:0;min-height:0;padding:8px 10px 10px;
}
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:2px 4px 6px;flex:0 0 auto;
}
#brand{
  font-family:var(--serif);font-size:19px;letter-spacing:.14em;
  color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.6);white-space:nowrap;
}
#brand small{display:block;font-size:9px;letter-spacing:.3em;color:#8a7858}
.badge{
  font-size:11px;padding:3px 9px;border-radius:99px;
  background:rgba(216,178,101,.12);border:1px solid rgba(216,178,101,.3);
  color:#e3cb96;white-space:nowrap;
}
#topbar .sp{flex:1}
.iconbtn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  transition:background .18s,transform .18s;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn.off{opacity:.42}

/* 对手区 / 玩家区 */
.zone{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:12px;
  padding:0 6px;min-height:0;
}
#oppZone{height:clamp(96px,17vh,190px)}
#meZone{height:auto;padding-top:8px}
#avatarBox{
  position:relative;height:100%;width:clamp(150px,24vw,260px);flex:0 0 auto;
  display:flex;align-items:flex-end;justify-content:center;
}
#avatarBox svg{height:100%;width:auto;display:block;overflow:visible}
#bubble{
  position:absolute;left:78%;top:4%;transform:translateX(0) scale(.6);
  transform-origin:0 100%;opacity:0;pointer-events:none;
  max-width:200px;padding:8px 12px;border-radius:14px 14px 14px 4px;
  background:linear-gradient(#fff8e8,#f0e0bf);color:#4a3418;
  font-size:13px;line-height:1.45;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  transition:opacity .22s, transform .28s cubic-bezier(.2,1.5,.4,1);
  z-index:6;
}
#bubble.show{opacity:1;transform:translateX(0) scale(1)}
.plate{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:10px;
  padding:7px 11px;border-radius:12px;
  background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
  transition:box-shadow .3s,border-color .3s;
}
.plate.active{
  border-color:rgba(216,178,101,.55);
  box-shadow:0 0 0 1px rgba(216,178,101,.25),0 6px 22px rgba(216,178,101,.18), inset 0 1px 0 rgba(255,255,255,.1);
}
.plate .pdot{
  width:13px;height:13px;border-radius:50%;flex:0 0 auto;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 0 0 2px rgba(0,0,0,.25);
}
.plate.red .pdot{background:radial-gradient(circle at 35% 30%,#ff8f78,#b3161c)}
.plate.black .pdot{background:radial-gradient(circle at 35% 30%,#6c7a88,#1d2630)}
.plate .pname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .ptitle{font-size:10.5px;color:#a4916f;margin-top:1px;white-space:nowrap}
.plate .pmid{min-width:0;flex:0 1 auto}
.plate .ptray{
  flex:1 1 auto;display:flex;flex-wrap:wrap;gap:2px;align-content:center;
  max-height:34px;overflow:hidden;min-width:0;
}
.tchip{
  width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:11px;font-weight:700;line-height:1;
  background:radial-gradient(circle at 36% 30%,#f3dcb3,#c79f66);
  box-shadow:0 1px 0 #8e6a3c, 0 2px 3px rgba(0,0,0,.35);
  animation:chipIn .32s cubic-bezier(.2,1.6,.4,1) both;
}
.tchip.r{color:var(--red-pc)} .tchip.b{color:var(--blk-pc)}
@keyframes chipIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.clock{
  font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:#e8d6ac;
  padding:3px 9px;border-radius:9px;background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.07);flex:0 0 auto;letter-spacing:.04em;
}
.plate.active .clock{color:#ffe9b5}
#thinking{font-size:11.5px;color:var(--gold);flex:0 0 auto;opacity:0;transition:opacity .2s;white-space:nowrap}
#thinking.on{opacity:1}
#thinking i{animation:dotb 1.1s infinite;font-style:normal}
#thinking i:nth-child(2){animation-delay:.16s}
#thinking i:nth-child(3){animation-delay:.32s}
@keyframes dotb{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ============ 棋盘 ============ */
#boardArea{
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  position:relative;
}
#persp{perspective:1900px;perspective-origin:50% 44%}
#board{
  position:relative;
  width:calc(var(--cell) * (8 + 2 * var(--pad)));
  height:calc(var(--cell) * (9 + 2 * var(--pad)));
  transform:rotateX(13deg);
  transform-style:preserve-3d;
  border-radius:calc(var(--cell) * .1);
  background:
    linear-gradient(176deg, rgba(255,255,255,.14), rgba(0,0,0,.05) 40%, rgba(90,50,14,.14)),
    repeating-linear-gradient(91deg, rgba(120,72,24,.055) 0 2px, rgba(255,255,255,0) 2px 7px),
    repeating-linear-gradient(88.5deg, rgba(120,72,24,.045) 0 1px, rgba(255,255,255,0) 1px 13px),
    radial-gradient(120% 90% at 30% 12%, #f0d3a0 0%, #e4c08a 45%, #d3a96f 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 0 calc(var(--cell)*.5) rgba(126,76,28,.3),
    0 2px 0 #b2814a, 0 4px 0 #9b6c3a, 0 7px 0 #83582c, 0 10px 0 #6b4622, 0 13px 0 #543519,
    0 20px 34px rgba(0,0,0,.55), 0 42px 70px rgba(0,0,0,.4);
}
#board:after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background-image:var(--noise);background-size:150px 150px;opacity:.38;mix-blend-mode:multiply;
}
#boardGlow{
  position:absolute;left:50%;top:50%;width:112%;height:112%;
  transform:translate(-50%,-50%) translateZ(-30px);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,205,130,.13), rgba(255,205,130,0) 70%);
}
#grid{
  position:absolute;
  left:calc(var(--cell) * var(--pad));top:calc(var(--cell) * var(--pad));
  width:calc(var(--cell) * 8);height:calc(var(--cell) * 9);
  transform-style:preserve-3d;
}
#lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
#cells,#pieces,#fx,#marks{position:absolute;inset:0;transform-style:preserve-3d}
#pieces,#fx,#marks{pointer-events:none}
.cell{
  position:absolute;width:var(--cell);height:var(--cell);
  left:calc(var(--cx) * var(--cell));top:calc(var(--cy) * var(--cell));
  margin:calc(var(--cell) * -.5) 0 0 calc(var(--cell) * -.5);
  cursor:pointer;
}
.cell .dot{
  position:absolute;left:50%;top:50%;width:calc(var(--cell)*.26);height:calc(var(--cell)*.26);
  margin:calc(var(--cell)*-.13) 0 0 calc(var(--cell)*-.13);border-radius:50%;
  background:radial-gradient(circle,rgba(60,140,90,.9),rgba(40,110,70,.35));
  box-shadow:0 0 calc(var(--cell)*.18) rgba(80,200,130,.5);
  opacity:0;transform:scale(.2);transition:opacity .2s,transform .26s cubic-bezier(.2,1.6,.4,1);
}
.cell.can .dot{opacity:.95;transform:none;animation:dotPulse 1.8s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.cell .ring{
  position:absolute;left:50%;top:50%;width:calc(var(--cell)*.94);height:calc(var(--cell)*.94);
  margin:calc(var(--cell)*-.47) 0 0 calc(var(--cell)*-.47);border-radius:50%;
  border:calc(var(--cell)*.05) solid rgba(214,52,40,.85);
  box-shadow:0 0 calc(var(--cell)*.3) rgba(230,70,50,.6);
  opacity:0;transform:scale(.7);transition:opacity .2s,transform .26s cubic-bezier(.2,1.6,.4,1);
}
.cell.eat .ring{opacity:1;transform:none;animation:eatPulse 1.3s ease-in-out infinite}
@keyframes eatPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.55}}
/* 起终点标记 */
.mark{
  position:absolute;width:calc(var(--cell)*.92);height:calc(var(--cell)*.92);
  left:calc(var(--mx) * var(--cell));top:calc(var(--my) * var(--cell));
  margin:calc(var(--cell)*-.46) 0 0 calc(var(--cell)*-.46);
  animation:markIn .3s ease both;
}
.mark span{position:absolute;width:26%;height:26%;border:calc(var(--cell)*.045) solid rgba(216,178,101,.9)}
.mark span:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.mark span:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.mark span:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.mark span:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.mark.hint span{border-color:rgba(120,230,170,.95)}
.mark.hint{animation:markIn .3s ease both, hintBlink 1s ease-in-out infinite}
@keyframes markIn{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:none}}
@keyframes hintBlink{0%,100%{opacity:1}50%{opacity:.3}}

/* ============ 棋子 ============ */
.piece{
  position:absolute;left:0;top:0;
  width:calc(var(--cell)*.9);height:calc(var(--cell)*.9);
  --pz:0px;--ps:1;
  transform:
    translate3d(calc(var(--px) * var(--cell) - 50%), calc(var(--py) * var(--cell) - 50%), var(--pz))
    scale(var(--ps));
  transition:transform .3s cubic-bezier(.33,.9,.3,1), box-shadow .22s ease, opacity .2s;
  border-radius:50%;display:grid;place-items:center;
  will-change:transform;
  background:
    radial-gradient(circle at 34% 26%, rgba(255,255,255,.75), rgba(255,255,255,0) 52%),
    radial-gradient(circle at 50% 48%, #f6e2bb 0%, #ead0a1 44%, #d7b17a 72%, #b98c50 92%, #9d7039 100%);
  box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    inset 0 calc(var(--cell)*.02) calc(var(--cell)*.03) rgba(255,255,255,.5),
    0 1px 0 #c49a62, 0 2px 0 #b98f56, 0 3px 0 #ad8349, 0 4px 0 #9f763f,
    0 5px 0 #8f6836, 0 6px 0 #7e5a2d, 0 7px 0 #6b4a24,
    0 9px 9px rgba(0,0,0,.38), 0 14px 18px rgba(0,0,0,.3);
}
.piece.blk{
  background:
    radial-gradient(circle at 34% 26%, rgba(255,255,255,.6), rgba(255,255,255,0) 52%),
    radial-gradient(circle at 50% 48%, #ecd4ac 0%, #ddc294 44%, #c7a26d 72%, #a87f46 92%, #8d6834 100%);
}
.piece i{
  position:absolute;left:7%;top:7%;right:7%;bottom:7%;border-radius:50%;
  border:1px solid rgba(126,80,32,.42);
  box-shadow:inset 0 1px 2px rgba(120,74,26,.5), 0 1px 0 rgba(255,255,255,.45);
}
.piece b{
  position:relative;font-family:var(--serif);font-weight:700;line-height:1;
  font-size:calc(var(--cell)*.455);
  text-shadow:0 1px 0 rgba(255,255,255,.6), 0 -1px 1px rgba(80,30,10,.45), 0 2px 3px rgba(90,50,20,.3);
}
.piece.red b{color:var(--red-pc)}
.piece.blk b{color:var(--blk-pc)}
.piece.sel{
  box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    0 1px 0 #c49a62, 0 3px 0 #ad8349, 0 5px 0 #8f6836, 0 7px 0 #6b4a24,
    0 0 0 calc(var(--cell)*.055) rgba(255,214,120,.85),
    0 0 calc(var(--cell)*.4) rgba(255,196,80,.75),
    0 12px 20px rgba(0,0,0,.45);
}
.piece.sel{--pz:calc(var(--cell)*.13);--ps:1.04;animation:selGlow 1.5s ease-in-out infinite}
@keyframes selGlow{
  0%,100%{box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    0 2px 0 #b98f56, 0 4px 0 #9f763f, 0 6px 0 #7e5a2d, 0 7px 0 #6b4a24,
    0 0 0 calc(var(--cell)*.04) rgba(255,214,120,.75),
    0 0 calc(var(--cell)*.3) rgba(255,190,70,.5),
    0 16px 22px rgba(0,0,0,.45)}
  50%{box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    0 2px 0 #b98f56, 0 4px 0 #9f763f, 0 6px 0 #7e5a2d, 0 7px 0 #6b4a24,
    0 0 0 calc(var(--cell)*.08) rgba(255,228,160,.95),
    0 0 calc(var(--cell)*.62) rgba(255,196,80,.9),
    0 16px 22px rgba(0,0,0,.45)}
}
.piece.lift{
  box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    0 1px 0 #c49a62, 0 3px 0 #ad8349, 0 5px 0 #8f6836, 0 7px 0 #6b4a24,
    0 18px 22px rgba(0,0,0,.45), 0 30px 40px rgba(0,0,0,.35);
  z-index:40;
}
.piece.chk{animation:chkPulse .7s ease-in-out infinite}
@keyframes chkPulse{
  0%,100%{box-shadow:inset 0 0 0 rgba(0,0,0,0), 0 3px 0 #ad8349, 0 6px 0 #7e5a2d, 0 0 0 2px rgba(255,60,40,.5), 0 0 calc(var(--cell)*.3) rgba(255,50,30,.5), 0 10px 14px rgba(0,0,0,.4)}
  50%{box-shadow:inset 0 0 0 rgba(0,0,0,0), 0 3px 0 #ad8349, 0 6px 0 #7e5a2d, 0 0 0 calc(var(--cell)*.08) rgba(255,70,40,.8), 0 0 calc(var(--cell)*.55) rgba(255,60,30,.9), 0 10px 14px rgba(0,0,0,.4)}
}
.piece.die{opacity:0;--ps:.25;--pz:calc(var(--cell)*.9);transition:transform .34s ease-out, opacity .3s ease-out;z-index:50}
.piece.born{animation:bornIn .3s ease both}
@keyframes bornIn{from{opacity:0}to{opacity:1}}
.noanim .piece,.noanim .cell{transition:none !important}

/* 特效层 */
.spark{
  position:absolute;left:calc(var(--fx) * var(--cell));top:calc(var(--fy) * var(--cell));
  width:0;height:0;
}
.spark .wave{
  position:absolute;left:0;top:0;width:calc(var(--cell)*.9);height:calc(var(--cell)*.9);
  margin:calc(var(--cell)*-.45) 0 0 calc(var(--cell)*-.45);border-radius:50%;
  border:calc(var(--cell)*.06) solid rgba(255,212,120,.95);
  animation:waveOut .55s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes waveOut{from{transform:scale(.35);opacity:1}to{transform:scale(2.1);opacity:0}}
.spark .p{
  position:absolute;width:calc(var(--cell)*.1);height:calc(var(--cell)*.1);
  margin:calc(var(--cell)*-.05) 0 0 calc(var(--cell)*-.05);border-radius:50%;
  background:radial-gradient(circle,#fff3c8,#e0a33c);
  animation:partOut .6s ease-out forwards;
}
@keyframes partOut{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}
}
#toast{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
  font-family:var(--serif);font-size:clamp(34px,7vmin,70px);font-weight:700;
  color:#ffdf8d;letter-spacing:.1em;pointer-events:none;opacity:0;z-index:60;
  text-shadow:0 0 18px rgba(255,80,40,.9),0 0 50px rgba(255,60,20,.6),0 4px 10px rgba(0,0,0,.7);
}
#toast.show{animation:toastPop 1.25s ease forwards}
@keyframes toastPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(1deg)}
  32%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  78%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}
}
#flash{position:absolute;inset:-20%;pointer-events:none;opacity:0;z-index:5;
  background:radial-gradient(closest-side,rgba(255,60,30,.38),rgba(255,60,30,0) 70%)}
#flash.on{animation:flashHit .6s ease-out}
@keyframes flashHit{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
.shake{animation:shk .36s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{
  10%,90%{transform:translate3d(-2px,1px,0)}
  20%,80%{transform:translate3d(4px,-2px,0)}
  30%,50%,70%{transform:translate3d(-6px,2px,0)}
  40%,60%{transform:translate3d(6px,-1px,0)}
}
.piece.nono{animation:nono .42s ease}
@keyframes nono{
  0%,100%{box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    0 2px 0 #b98f56, 0 4px 0 #9f763f, 0 6px 0 #7e5a2d, 0 7px 0 #6b4a24,
    0 9px 9px rgba(0,0,0,.38)}
  35%,70%{box-shadow:
    inset 0 calc(var(--cell)*-.035) calc(var(--cell)*.07) rgba(122,74,26,.4),
    0 2px 0 #b98f56, 0 4px 0 #9f763f, 0 6px 0 #7e5a2d, 0 7px 0 #6b4a24,
    0 0 0 calc(var(--cell)*.07) rgba(255,64,40,.85),
    0 0 calc(var(--cell)*.45) rgba(255,56,30,.8),
    0 9px 9px rgba(0,0,0,.38)}
}

/* ============ 右侧面板 ============ */
#panel{
  position:relative;min-height:0;display:flex;flex-direction:column;gap:10px;
  padding:12px 12px 12px 2px;overflow:hidden;
}
.card{
  background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 12px;
  box-shadow:0 6px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
}
.card h3{
  margin:0 0 9px;font-size:11px;font-weight:600;letter-spacing:.2em;
  color:var(--gold-dim);text-transform:uppercase;
}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.07);
  transition:all .18s;color:#c9bb9d;
}
.seg button.on{
  background:linear-gradient(rgba(216,178,101,.3),rgba(216,178,101,.13));
  border-color:rgba(216,178,101,.6);color:#ffeec4;
  box-shadow:0 2px 10px rgba(216,178,101,.22), inset 0 1px 0 rgba(255,255,255,.14);
}
.seg button:active{transform:scale(.96)}
.seg.col{flex-direction:column}
.seg.col button{text-align:left;padding:8px 10px;display:flex;align-items:center;gap:8px}
.seg.col button em{font-style:normal;font-size:10.5px;color:#9b8a68;margin-left:auto}
.seg.col button.on em{color:#d8c08e}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{
  padding:9px 6px;border-radius:9px;font-size:12.5px;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.07);
  transition:all .18s;
}
.acts button:active{transform:scale(.95)}
.acts button:disabled{opacity:.35}
.acts button.pri{
  background:linear-gradient(rgba(190,40,34,.65),rgba(140,22,20,.55));
  border-color:rgba(255,120,90,.35);color:#ffe6d8;
}
#logCard{flex:1 1 auto;min-height:60px;display:flex;flex-direction:column;overflow:hidden}
#log{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:12.5px;line-height:1.75;padding-right:4px;
}
#log::-webkit-scrollbar{width:5px}
#log::-webkit-scrollbar-thumb{background:rgba(216,178,101,.3);border-radius:3px}
.lrow{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.lrow .n{width:22px;color:#7e6e52;font-size:11px;flex:0 0 auto;text-align:right}
.lrow .m{font-family:var(--serif);font-size:13.5px;min-width:72px}
.lrow .m.r{color:#f2a99e} .lrow .m.b{color:#a8bdd4}
.lrow.last{background:rgba(216,178,101,.1);border-radius:6px}
#log .empty{color:#6b5c44;font-size:12px;text-align:center;padding:14px 0}
#stat{display:flex;gap:10px;font-size:11px;color:#9b8a68;flex-wrap:wrap}
#stat b{color:#d9c69e;font-weight:600}

/* ============ 遮罩 / 菜单 ============ */
#veil{
  position:absolute;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(60% 60% at 50% 40%,rgba(30,18,9,.82),rgba(8,5,2,.95));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#veil.show{opacity:1;pointer-events:auto}
.sheet{
  width:min(92vw,470px);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:26px 26px 22px;border-radius:22px;text-align:center;
  background:linear-gradient(170deg,#2f2013,#1b1108 70%);
  border:1px solid rgba(216,178,101,.25);
  box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateY(14px) scale(.96);opacity:0;transition:transform .36s cubic-bezier(.2,1.3,.4,1),opacity .3s;
}
#veil.show .sheet{transform:none;opacity:1}
.sheet h1{
  font-family:var(--serif);font-size:34px;margin:2px 0 2px;letter-spacing:.2em;
  color:#f0d79c;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 30px rgba(216,178,101,.3);
}
.sheet .sub{font-size:11px;letter-spacing:.42em;color:#9c8148;margin-bottom:20px}
.sheet .grp{text-align:left;margin-bottom:14px}
.sheet .grp>span{display:block;font-size:11px;letter-spacing:.18em;color:var(--gold-dim);margin-bottom:7px}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcard{
  padding:14px 10px;border-radius:14px;text-align:center;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);transition:all .2s;
}
.mcard .ic{font-size:26px;line-height:1.1}
.mcard .t{font-size:14px;margin-top:5px;font-weight:600}
.mcard .d{font-size:10.5px;color:#9b8a68;margin-top:2px}
.mcard.on{
  background:linear-gradient(rgba(216,178,101,.26),rgba(216,178,101,.08));
  border-color:rgba(216,178,101,.6);box-shadow:0 4px 18px rgba(216,178,101,.2);
}
.sheet .big{
  width:100%;margin-top:8px;padding:14px;border-radius:13px;font-size:16px;font-weight:600;
  font-family:var(--serif);letter-spacing:.24em;
  background:linear-gradient(#c9312b,#8e1a16);color:#fff2e4;
  box-shadow:0 8px 24px rgba(180,40,30,.4), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .16s;
}
.sheet .big:active{transform:scale(.97)}
.sheet .ghost{
  width:100%;margin-top:8px;padding:11px;border-radius:12px;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
}
#resIcon{font-size:52px;line-height:1}
#resSub{font-size:13px;color:#b4a382;margin:8px 0 16px;line-height:1.7}
#resSub b{color:#e8d2a2}
.tips{margin-top:14px;font-size:11px;color:#7d6c50;line-height:1.7}

/* ============ 窄屏 / 平板 ============ */
@media (max-width:1000px), (max-aspect-ratio:1/1){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #panel{
    flex-direction:row;align-items:center;gap:7px;padding:0 10px 9px;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  }
  #panel .card{flex:0 0 auto;padding:7px 8px;border-radius:11px}
  #panel .card h3{display:none}
  #panel .seg.col{flex-direction:row}
  #panel .seg.col button{padding:8px 10px;font-size:12px}
  #panel .seg.col button em{display:none}
  #panel .seg button{padding:8px 10px;white-space:nowrap}
  #panel .acts{grid-template-columns:repeat(4,auto)}
  #panel .acts button{padding:8px 11px;white-space:nowrap}
  #logCard{flex:1 1 150px;min-width:130px;max-width:46vw}
  #log{max-height:40px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;line-height:1.3}
  #log .lrow{display:inline-flex;margin-right:12px;padding:0}
  #log .lrow .m{min-width:0;margin-left:3px;font-size:13px}
  #log .empty{padding:6px 10px}
  #oppZone{height:clamp(72px,11vh,124px)}
  #meZone{padding-top:6px}
  .plate{padding:6px 10px}
  #statCard{display:none}
}
@media (max-width:620px){
  #brand{font-size:16px}
  .plate .ptray{display:none}
  #avatarBox{width:clamp(110px,30vw,170px)}
}
@media (max-height:520px){
  #oppZone{height:72px}
  #topbar{padding-bottom:2px}
}

/* ============ 对手形象 ============ */
#fig{transform-origin:50% 100%;animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.6px) scale(1.006)}}
#headG{transform-origin:160px 130px;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.think #headG{transform:rotate(-4deg) translateY(-2px)}
.happy #headG{animation:nod 1s ease-in-out}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg) translateY(2px)}60%{transform:rotate(-2deg)}}
.sad #headG{transform:rotate(2deg) translateY(4px)}
.lid{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0);transition:transform .09s linear}
.blink .lid{transform:scaleY(1)}
.think .lid{transform:scaleY(.45)}
#armsRest,#armsThink{transition:opacity .3s}
#armsThink{opacity:0}
.think #armsRest{opacity:0}
.think #armsThink{opacity:1}
#dots{opacity:0;transition:opacity .3s}
.think #dots{opacity:1}
#dots circle{animation:dotFloat 1.6s ease-in-out infinite}
#dots circle:nth-child(2){animation-delay:.22s}
#dots circle:nth-child(3){animation-delay:.44s}
@keyframes dotFloat{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
#dots circle{transform-box:fill-box;transform-origin:50% 50%}
#steam path{animation:steam 3.2s ease-in-out infinite;transform-box:fill-box}
#steam path:nth-child(2){animation-delay:1.05s}
#steam path:nth-child(3){animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(4px) scaleY(.7)}30%{opacity:.5}100%{opacity:0;transform:translateY(-16px) scaleY(1.3)}}
#drop{opacity:0;transition:opacity .4s}
.sad #drop{opacity:1;animation:dropFall 1.8s ease-in infinite}
@keyframes dropFall{0%{opacity:0;transform:translateY(-4px)}25%{opacity:.9}100%{opacity:0;transform:translateY(16px)}}
#lean{transition:transform .5s cubic-bezier(.3,1.1,.4,1)}
.reach #lean{transform:translateY(7px) scale(1.035)}
.beard,.specs{opacity:0;transition:opacity .3s}
.hasBeard .beard{opacity:1}
.hasSpecs .specs{opacity:1}

/* 棋盘线条 */
#lines .ln{stroke:var(--wood-line);fill:none;stroke-linecap:round;stroke-linejoin:round}
#lines .bd{stroke:rgba(64,36,12,.85)}
#lines .rv{
  fill:rgba(88,52,18,.46);font-family:var(--serif);font-weight:700;
  letter-spacing:.06em;paint-order:stroke;
}
/* SVG 配色（呈现属性不支持 var，用 CSS 驱动） */
#gRobe .s0{stop-color:var(--robe-l)}
#gRobe .s1{stop-color:var(--robe)}
#gRobe .s2{stop-color:var(--robe-d)}
#gHair .sh{stop-color:var(--hair)}
#avatar .rbD{fill:var(--robe-d)}
#avatar .rbL{fill:var(--robe-l)}
#avatar .shair{stroke:var(--hair)}
#avatar .sRobeD{stroke:var(--robe-d)}
#avatar .sRobe{stroke:var(--robe)}
#avatar .iris{transform-box:fill-box;transform-origin:50% 50%;transition:transform .5s ease}
.think #avatar .iris, .think .iris{transform:translateY(2.6px)}
</style>
</head>

          var kk=(ply&31)*2;
          if(KILL[kk]!==m){ KILL[kk+1]=KILL[kk]; KILL[kk]=m; }
          HIST[(m>>7)*90+(m&127)]+=depth*depth;
        }
        break;
      }
    }
  }
  rep.pop();
  if(cnt===0) return -MATE+ply;
  if(!aborted){
    var f = best<=a0 ? 1 : (alpha>=beta ? 2 : 0);
    if(TT.size>700000) TT.clear();
    TT.set(h1,{k:h2,d:depth,s:best,f:f,m:bestM});
  }
  return best;
}

function think(arr,s,maxDepth,maxMs,repHashes){
  load(arr,s);
  TT.clear(); HIST=new Int32Array(8100); KILL=new Int32Array(128);
  nodes=0; aborted=false; deadline=Date.now()+(maxMs||1000);
  rep=(repHashes||[]).slice();
  var roots=legal(s);
  if(roots.length===0) return {move:0,score:-MATE,depth:0,nodes:0,list:[],mate:true};
  var scored=roots.map(function(m){ return {m:m,s:0}; }), best=roots[0], bestS=0, done=0, d;
  for(d=1; d<=maxDepth; d++){
    scored.sort(function(a,b){ return b.s-a.s; });
    var cur=[], alpha=-INF, bm=0, bs=-INF, i;
    rep.push(h1);
    for(i=0;i<scored.length;i++){
      var m=scored[i].m, cap=mk(m);
      var v=-ab(d-1,-INF,-alpha,1);
      um(m,cap);
      if(aborted){ rep.pop(); break; }
      cur.push({m:m,s:v});
      if(v>bs){ bs=v; bm=m; }
      if(v>alpha) alpha=v;
    }
    if(!aborted) rep.pop();
    if(aborted || !cur.length) break;
    scored=cur; best=bm; bestS=bs; done=d;
    if(bs>MATE-1000) break;
  }
  scored.sort(function(a,b){ return b.s-a.s; });
  return {move:best,score:bestS,depth:done,nodes:nodes,
          list:scored.slice(0,8).map(function(e){return {m:e.m,s:e.s};})};
}

/* ---------- 中文记谱 ---------- */
function moveName(arr,m){
  bd.set(arr);
  var f=m>>7, t=m&127, p=bd[f];
  if(!p) return '';
  var s=(p>>3)&1, ty=p&7;
  var fx=f%9, fy=(f-fx)/9, tx=t%9, tyy=(t-tx)/9;
  var ch=CHAR[p];
  var fnum = s===0 ? CN[9-fx] : String(fx+1);
  var tnum = s===0 ? CN[9-tx] : String(tx+1);
  var head = ch+fnum, y;
  if(ty!==KING){
    var same=[];
    for(y=0;y<10;y++) if(bd[y*9+fx]===p) same.push(y);
    if(same.length>1){
      same.sort(function(a,b){ return s===0 ? a-b : b-a; });
      var k=same.indexOf(fy);
      if(same.length===2) head=(k===0?'前':'后')+ch;
      else if(same.length===3) head=['前','中','后'][k]+ch;
      else head=CN[k+1]+ch;
    }
  }
  var act;
  if(fy===tyy) act='平'+tnum;
  else {
    var fwd = s===0 ? (tyy<fy) : (tyy>fy);
    var dd = tyy>fy ? tyy-fy : fy-tyy;
    if(ty===ROK||ty===CAN||ty===PAW||ty===KING) act=(fwd?'进':'退')+(s===0?CN[dd]:String(dd));
    else act=(fwd?'进':'退')+tnum;
  }
  return head+act;
}

var Sfx={
  ctx:null, out:null, noise:null,
  ensure:function(){

    g.gain.exponentialRampToValueAtTime(.0005,t+dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t+dur+.05);
  },
  knock:function(v,p){
    if(!S.sound) return; var c=this.ensure(); if(!c) return; v=v||1; p=p||1;
    var t=c.currentTime;

  [from,to].forEach(function(i){

    d.className='mark hint'; d.setAttribute('data-i',i);
    var p=dcoord(i);
    d.style.setProperty('--mx',p[0]); d.style.setProperty('--my',p[1]);
    d.innerHTML='<span></span><span></span><span></span><span></span>';
    marksEl.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },2600);
  });
}

/* ===== 特效 ===== */
function spark(i){
  var p=dcoord(i), d=document.createElement('div');
  d.className='spark';
  d.style.setProperty('--fx',p[0]); d.style.setProperty('--fy',p[1]);
  var h='<div class="wave"></div>', k;
  for(k=0;k<10;k++){
    var a=Math.PI*2*k/10+Math.random()*.5, r=38+Math.random()*34;
    h+='<div class="p" style="--dx:'+(Math.cos(a)*r).toFixed(1)+'px;--dy:'+(Math.sin(a)*r).toFixed(1)+
       'px;animation-delay:'+(Math.random()*.06).toFixed(3)+'s"></div>';
  }
  d.innerHTML=h; fxEl.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },800);
}
function shake(){
  ui.persp.classList.remove('shake');
  void ui.persp.offsetWidth;
  ui.persp.classList.add('shake');
  setTimeout(function(){ ui.persp.classList.remove('shake'); },400);
}
function toast(t){
  ui.toast.textContent=t;
  ui.toast.classList.remove('show'); void ui.toast.offsetWidth;
  ui.toast.classList.add('show');
}
function flash(){
  ui.flash.classList.remove('on'); void ui.flash.offsetWidth;
  ui.flash.classList.add('on');
}
function markCheck(on){
  var i;
  for(i=0;i<90;i++) if(G.objAt[i]) G.objAt[i].el.classList.remove('chk');
  if(on){
    for(i=0;i<90;i++) if(G.bd[i]===(1|(G.stm<<3))) { if(G.objAt[i]) G.objAt[i].el.classList.add('chk'); }
  }
}

/* ===== 吃子托盘 ===== */
function addChip(side,code){
  var tray = (side===(S.mode==='pvp'?0:S.mySide)) ? ui.meTray : ui.oppTray;
  var c=document.createElement('span');
  c.className='tchip '+(code>8?'b':'r');
  c.textContent=XQ.CHAR[code];
  tray.appendChild(c);
}
function rebuildTrays(){
  ui.meTray.innerHTML=''; ui.oppTray.innerHTML='';
  var mine=(S.mode==='pvp'?0:S.mySide);
  [0,1].forEach(function(s){
    G.caps[s].forEach(function(code){
      var c=document.createElement('span');
      c.className='tchip '+(code>8?'b':'r');
      c.textContent=XQ.CHAR[code];
      (s===mine?ui.meTray:ui.oppTray).appendChild(c);
    });
  });
}

/* ===== 棋谱 ===== */
function renderLog(){
  var h='', i;
  if(!G.hist.length){ ui.log.innerHTML='<div class="empty">尚无着法</div>'; return; }
  for(i=0;i<G.hist.length;i+=2){
    var n=(i/2|0)+1;
    var a=G.hist[i], b=G.hist[i+1];
    h+='<div class="lrow'+(i+2>=G.hist.length?' last':'')+'"><span class="n">'+n+'.</span>'+
       '<span class="m r">'+(a?a.notation:'')+'</span>'+
       '<span class="m b">'+(b?b.notation:'')+'</span></div>';
  }
  ui.log.innerHTML=h;
  ui.log.scrollTop=ui.log.scrollHeight;
}

/* ===== 名牌 / 时钟 ===== */
function fmt(ms){
  var s=Math.floor(ms/1000), m=Math.floor(s/60);
  s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function updatePlates(){
  var lv=LEVELS[S.level];
  var mine=(S.mode==='pvp'?0:S.mySide), theirs=mine^1;
  ui.badge.textContent = S.mode==='ai' ? '人机对战 · '+lv.title.split(' ')[0] : '双人对战';
  if(S.mode==='ai'){
    ui.oppName.textContent=lv.name; ui.oppTitle.textContent=lv.title+' · '+(theirs?'黑方':'红方');
    ui.meName.textContent='我'; ui.meTitle.textContent=(mine?'黑方 · 后行':'红方 · 先行');
  }else{
    ui.oppName.textContent='玩家二'; ui.oppTitle.textContent='黑方 · 后行';
    ui.meName.textContent='玩家一'; ui.meTitle.textContent='红方 · 先行';
  }
  ui.oppPlate.className='plate '+(theirs?'black':'red')+(G.stm===theirs&&!G.over?' active':'');
  ui.mePlate.className='plate '+(mine?'black':'red')+(G.stm===mine&&!G.over?' active':'');
  ui.oppClock.textContent=fmt(G.times[theirs]);
  ui.meClock.textContent=fmt(G.times[mine]);
  ui.stMove.textContent=Math.floor(G.hist.length/2)+1;
  ui.stCap.textContent=G.capCount;
  $('#btnUndo').disabled=!G.hist.length||G.aiBusy;
  $('#btnHint').disabled=G.aiBusy||!!G.over||G.busy;
}
setInterval(function(){
  if(!G.started||G.over) { G.lastTick=Date.now(); return; }
  var now=Date.now();
  if(G.lastTick) G.times[G.stm]+=now-G.lastTick;
  G.lastTick=now;
  var mine=(S.mode==='pvp'?0:S.mySide);
  ui.oppClock.textContent=fmt(G.times[mine^1]);
  ui.meClock.textContent=fmt(G.times[mine]);
},300);

/* ===== 开新局 ===== */
function newGame(){
  G.bd=Int8Array.from(XQ.START);
  G.stm=0; G.objAt=new Array(90); G.hist=[]; G.hashes=[]; G.noCap=0;
  G.over=null; G.sel=-1; G.selMoves=[]; G.caps=[[],[]]; G.times=[0,0];
  G.busy=false; G.aiBusy=false; G.capCount=0; G.lastTick=Date.now();
  S.flip = (S.mode==='ai' && S.mySide===1);
  clearBoardDom();
  noAnim(function(){
    refreshOrient();
    for(var i=0;i<90;i++) if(G.bd[i]) G.objAt[i]=newPiece(G.bd[i],i);
  });
  G.hashes.push(XQ.hashOf(G.bd,0));
  G.started=true;
  renderLog(); updatePlates(); markCheck(false);
  ui.thinking.classList.remove('on');
  ui.stNodes.textContent='—';
  Av.look(LEVELS[S.level]); Av.set('idle'); Av.hush();
  layout();
  if(S.mode==='ai'){
    setTimeout(function(){ if(G.started) talk('start'); },600);
    if(G.stm!==S.mySide) setTimeout(aiTurn,1100);
  }
}

/* ===== 走子 ===== */
function animateMove(obj,to,victim){
  return new Promise(function(res){
    var el=obj.el;
    el.style.transitionDuration='.13s';
    el.classList.add('lift');
    el.style.setProperty('--pz','calc(var(--cell)*.55)');
    el.style.setProperty('--ps','1.08');
    setTimeout(function(){
      el.style.transitionDuration='.29s';
      setPos(el,to);
      setTimeout(function(){
        el.style.transitionDuration='.12s';
        el.style.setProperty('--pz','0px');
        el.style.setProperty('--ps','1');
        if(victim){
          victim.el.classList.add('die');
          var v=victim.el;
          setTimeout(function(){ if(v.parentNode) v.parentNode.removeChild(v); },400);
          Sfx.capture(); shake(); spark(to);
        }else{
          Sfx.knock(1,.95+Math.random()*.12);
        }
        setTimeout(function(){
          el.classList.remove('lift');
          el.style.transitionDuration='';
          res();
        },140);
      },290);
    },130);
  });
}

function doMove(from,to,byAI){
  if(G.busy||G.over) return Promise.resolve();
  var obj=G.objAt[from], victim=G.objAt[to]||null;
  if(!obj||from<0||from>89||to<0||to>89){ clearSel(); return Promise.resolve(); }
  G.busy=true;
  var m=(from<<7)|to, capCode=G.bd[to], mover=G.stm;
  var notation=XQ.moveName(G.bd,m);
  G.hist.push({m:m,cap:capCode,capObj:victim,obj:obj,noCap:G.noCap,notation:notation,side:mover});
  G.bd[to]=G.bd[from]; G.bd[from]=0;
  G.objAt[to]=obj; G.objAt[from]=null; obj.i=to;
  if(capCode){ G.noCap=0; G.caps[mover].push(capCode); G.capCount++; addChip(mover,capCode); }
  else G.noCap++;
  clearSel(); setMarks(from,to);
  Av.hush();
  return animateMove(obj,to,victim).then(function(){
    G.stm=mover^1;
    G.hashes.push(XQ.hashOf(G.bd,G.stm));
    G.busy=false;
    afterMove(capCode,mover,byAI);
  })['catch'](function(){ G.busy=false; });
}

function afterMove(capCode,mover,byAI){
  renderLog();
  var inChk=XQ.inCheck(G.bd,G.stm);
  var moves=XQ.legalMoves(G.bd,G.stm);
  markCheck(inChk);
  updatePlates();

  if(moves.length===0){
    gameOver(mover, inChk?'绝杀':'困毙');
    return;
  }
  if(inChk){
    Sfx.check(); toast('将 军'); flash();
    if(S.mode==='ai'){
      if(byAI){ Av.set('happy'); talk('iCheck'); setTimeout(function(){ if(!G.over) Av.set('idle'); },1800); }
      else { Av.set('sad'); talk('uCheck'); }
    }
  }else if(S.mode==='ai'){
    if(capCode){
      if(byAI){ Av.set('happy'); talk('eatMine'); }
      else { Av.set('sad'); talk('eatYours'); }
      setTimeout(function(){ if(!G.over&&Av.state!=='think') Av.set('idle'); },1900);
    }else if(!byAI && Math.random()<.22){ talk('ok'); }
  }
  if(G.noCap>=120){ gameOver(-1,'自然限着和棋'); return; }
  var h=G.hashes[G.hashes.length-1], c=0, i;
  for(i=0;i<G.hashes.length;i++) if(G.hashes[i]===h) c++;
  if(c>=3){ gameOver(-1,'三次重复局面'); return; }
  if(G.hashes.length>8 && onlyKings()){ gameOver(-1,'双方无子力'); return; }

  if(S.mode==='ai' && G.stm!==S.mySide && !G.over) setTimeout(aiTurn,160);
}
function onlyKings(){
  for(var i=0;i<90;i++){ var p=G.bd[i]; if(p && (p&7)!==1 && (p&7)!==2 && (p&7)!==3) return false; }
  return true;
}

/* ===== AI 行棋 ===== */
function aiTurn(){
  if(G.over||S.mode!=='ai'||G.aiBusy||!G.started) return;
  var lv=LEVELS[S.level];
  G.aiBusy=true; updatePlates();
  ui.thinking.classList.add('on');
  Av.set('think');
  var longT=setTimeout(function(){ talk('longThink'); }, Math.max(900,lv.min+500));
  var t0=Date.now();
  askEngine(G.bd,G.stm,lv.depth,lv.time,G.hashes.slice(-16)).then(function(r){
    clearTimeout(longT);
    var wait=Math.max(0,lv.min-(Date.now()-t0));
    return sleep(wait).then(function(){ return r; });
  }).then(function(r){
    ui.thinking.classList.remove('on');
    Av.set('idle');
    G.aiBusy=false;
    if(G.over) { updatePlates(); return; }
    var mv=r.move;
    if(lv.rand>0 && r.list && r.list.length>1 && Math.random()<lv.rand){
      var top=r.list[0].s, cand=r.list.filter(function(e){ return top-e.s<=160; });
      if(cand.length>1) mv=cand[Math.floor(Math.random()*cand.length)].m;
    }
    if(r.nodes) ui.stNodes.textContent = r.nodes>9999 ? Math.round(r.nodes/1000)+'k' : r.nodes;
    if(!mv){ gameOver(G.stm^1,'无着可走'); return; }
    Av.reach();
    setTimeout(function(){ doMove(mv>>7,mv&127,true); },180);
  })['catch'](function(){
    clearTimeout(longT);
    ui.thinking.classList.remove('on'); G.aiBusy=false; Av.set('idle');
    var ms=XQ.legalMoves(G.bd,G.stm);
    if(ms.length){ var mv2=ms[Math.floor(Math.random()*ms.length)]; doMove(mv2>>7,mv2&127,true); }
  });
}

/* ===== 点击处理 ===== */
function onTap(i){
  if(G.over||G.busy) return;
  if(!G.started) return;
  if(S.mode==='ai' && (G.stm!==S.mySide||G.aiBusy)) return;
  var p=G.bd[i];
  if(G.sel>=0 && G.selMoves.indexOf(i)>=0){ doMove(G.sel,i,false); return; }
  if(p && ((p>>3)&1)===G.stm){ select(i); return; }
  if(p){
    var o=G.objAt[i];
    if(o){ o.el.classList.remove('nono'); void o.el.offsetWidth; o.el.classList.add('nono');
      setTimeout(function(){ o.el.classList.remove('nono'); },460); }
    Sfx.bad();
    return;
  }
  if(G.sel>=0){ Sfx.bad(); clearSel(); }
}
var pdSeen=false;
function tapFrom(e){
  var t=e.target;
  while(t&&t!==cellsEl&&!(t.getAttribute&&t.getAttribute('data-i'))) t=t.parentNode;
  if(!t||t===cellsEl) return;
  if(e.cancelable) e.preventDefault();
  onTap(+t.getAttribute('data-i'));
}
cellsEl.addEventListener('pointerdown',function(e){ pdSeen=true; tapFrom(e); });
cellsEl.addEventListener('click',function(e){ if(pdSeen){ pdSeen=false; return; } tapFrom(e); });

/* ===== 悔棋 / 提示 ===== */
function undoOne(){
  var h=G.hist.pop(); if(!h) return;
  var from=h.m>>7, to=h.m&127;
  G.bd[from]=G.bd[to]; G.bd[to]=h.cap;
  G.objAt[from]=h.obj; G.objAt[to]=h.capObj||null;
  h.obj.i=from;
  noAnim(function(){ setPos(h.obj.el,from); });
  if(h.capObj){
    var o=h.capObj;
    o.el.classList.remove('die');
    if(!o.el.parentNode) piecesEl.appendChild(o.el);
    noAnim(function(){ setPos(o.el,to); });
    o.i=to;
    G.caps[h.side].pop(); G.capCount--;
  }
  G.noCap=h.noCap; G.stm=h.side; G.hashes.pop();
  G.over=null;
}
function undo(){
  if(G.busy||G.aiBusy||!G.hist.length) return;
  G.lastTick=Date.now();
  clearSel();
  var steps=1;
  if(S.mode==='ai'){
    steps = (G.hist.length>=2) ? 2 : 1;
    if(G.hist[G.hist.length-1].side===S.mySide) steps=1;
  }
  for(var k=0;k<steps;k++) undoOne();
  rebuildTrays();
  marksEl.innerHTML='';
  if(G.hist.length){ var l=G.hist[G.hist.length-1]; setMarks(l.m>>7,l.m&127); }
  markCheck(XQ.inCheck(G.bd,G.stm));
  renderLog(); updatePlates();
  Sfx.tick();
  $('#veil').classList.remove('show');
  if(S.mode==='ai'){ Av.set('idle'); talk('undo'); }
}
function hint(){
  if(G.busy||G.aiBusy||G.over) return;
  $('#btnHint').disabled=true;
  askEngine(G.bd,G.stm,4,800,[]).then(function(r){
    updatePlates();
    if(r.move){ showHintMark(r.move>>7,r.move&127); Sfx.tick(); }
  });
}

/* ===== 终局 ===== */
function gameOver(winner,way){
  if(G.over) return;
  G.over={winner:winner,way:way};
  clearSel(); updatePlates();
  var mine=(S.mode==='pvp'?0:S.mySide);
  var iWin = winner===mine;
  var ttl, icon, sub;
  if(winner===-1){ ttl='和 棋'; icon='🤝'; }
  else if(S.mode==='pvp'){ ttl=(winner===0?'红 方 胜':'黑 方 胜'); icon='🏆'; }
  else { ttl=iWin?'你 胜 了':'你 输 了'; icon=iWin?'🏆':'😵'; }
  setTimeout(function(){
    if(winner===-1){ Sfx.draw(); if(S.mode==='ai'){Av.set('idle');talk('draw');} }
    else if(S.mode==='pvp'){ Sfx.win(); }
    else if(iWin){ Sfx.win(); Av.set('sad'); talk('lose'); }
    else { Sfx.lose(); Av.set('happy'); talk('win'); }
    toast(winner===-1?'和 棋':(S.mode==='pvp'?ttl:(iWin?'胜':'负')));
  },420);
  setTimeout(function(){
    $('#resIcon').textContent=icon;
    $('#resTitle').textContent=ttl;
    $('#resWay').textContent=way;
    var tot=fmt(G.times[0]+G.times[1]);
    $('#resSub').innerHTML='共走 <b>'+G.hist.length+'</b> 着 · 用时 <b>'+tot+'</b> · 吃子 <b>'+G.capCount+'</b>'+
      (S.mode==='ai'?'<br>对手：<b>'+LEVELS[S.level].name+'</b>（'+LEVELS[S.level].title+'）':'');
    $('#menuSheet').style.display='none';
    $('#resSheet').style.display='';
    $('#veil').classList.add('show');
  },1500);
}

/* ===== 控件 ===== */
function segPick(wrap,attr,val){
  var bs=wrap.children,i;
  for(i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute(attr)===String(val));
}
function buildLevels(wrap,cls){
  var h='',i;
  for(i=0;i<LEVELS.length;i++)
    h+='<button data-lv="'+i+'" class="'+(i===S.level?'on':'')+'">'+LEVELS[i].name+'<em>'+LEVELS[i].title+'</em></button>';
  wrap.innerHTML=h;
  wrap.addEventListener('click',function(e){
    var t=e.target; while(t&&t!==wrap&&!t.getAttribute('data-lv')) t=t.parentNode;
    if(!t||t===wrap) return;
    S.level=+t.getAttribute('data-lv'); save();
    segPick($('#segLevel'),'data-lv',S.level); segPick($('#mLevel'),'data-lv',S.level);
    Av.look(LEVELS[S.level]); updatePlates();
    if(G.started&&S.mode==='ai'){ Av.set('idle'); Av.say(LEVELS[S.level].name+'：请多指教。'); }
  });
}
buildLevels($('#segLevel')); buildLevels($('#mLevel'));

$('#segMode').addEventListener('click',function(e){
  var m=e.target.getAttribute('data-mode'); if(!m) return;
  S.mode=m; save(); syncControls(); newGame();
});
$('#segSide').addEventListener('click',function(e){
  var s=e.target.getAttribute('data-side'); if(s===null) return;
  S.mySide=+s; save(); syncControls(); newGame();
});
$('#mMode').addEventListener('click',function(e){
  var t=e.target; while(t&&!t.getAttribute('data-mode')) t=t.parentNode;
  if(!t) return;
  S.mode=t.getAttribute('data-mode'); save(); syncControls();
});
$('#mSide').addEventListener('click',function(e){
  var s=e.target.getAttribute('data-side'); if(s===null) return;
  S.mySide=+s; save(); syncControls();
});
function syncControls(){
  segPick($('#segMode'),'data-mode',S.mode);
  segPick($('#segSide'),'data-side',S.mySide);
  segPick($('#mSide'),'data-side',S.mySide);
  segPick($('#segLevel'),'data-lv',S.level);
  segPick($('#mLevel'),'data-lv',S.level);
  var mc=$('#mMode').children,i;
  for(i=0;i<mc.length;i++) mc[i].classList.toggle('on',mc[i].getAttribute('data-mode')===S.mode);
  var ai=S.mode==='ai';
  $('#lvCard').style.display=ai?'':'none';
  $('#mLvGrp').style.display=ai?'':'none';
  $('#mSideGrp').style.display=ai?'':'none';
  $('#avatarBox').style.opacity=1;
  $('#btnSound').classList.toggle('off',!S.sound);
  $('#btnSound').textContent=S.sound?'🔊':'🔇';
  updatePlates();
}
$('#btnNew').addEventListener('click',function(){ newGame(); });
$('#btnUndo').addEventListener('click',undo);
$('#btnHint').addEventListener('click',hint);
function doFlip(){ S.flip=!S.flip; noAnim(refreshOrient); Sfx.tick(); }
$('#btnFlip').addEventListener('click',doFlip);
$('#btnFlip2').addEventListener('click',doFlip);
$('#btnSound').addEventListener('click',function(){
  S.sound=!S.sound; save(); syncControls();
  if(S.sound){ Sfx.unlock(); Sfx.knock(); }
});
$('#btnMenu').addEventListener('click',function(){
  $('#resSheet').style.display='none';
  $('#menuSheet').style.display='';
  $('#veil').classList.add('show');
});
$('#btnStart').addEventListener('click',function(){
  Sfx.unlock();
  $('#veil').classList.remove('show');
  syncControls(); newGame();
});
$('#btnAgain').addEventListener('click',function(){
  $('#veil').classList.remove('show');
  newGame();
});
$('#btnReview').addEventListener('click',function(){ $('#veil').classList.remove('show'); });
$('#veil').addEventListener('click',function(e){
  if(e.target===$('#veil') && G.started){ $('#veil').classList.remove('show'); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='u'||e.key==='U') undo();
  else if(e.key==='h'||e.key==='H') hint();
  else if(e.key==='n'||e.key==='N') newGame();
  else if(e.key==='Escape') $('#veil').classList.remove('show');
});

/* ===== 启动 ===== */
window.addEventListener('resize',function(){ noAnim(layout); });
if(window.ResizeObserver){
  new ResizeObserver(function(){ noAnim(layout); }).observe($('#boardArea'));
}
syncControls();
Av.look(LEVELS[S.level]);
newGame();
G.started=false;
layout();
setTimeout(function(){ layout(); $('#veil').classList.add('show'); },60);
window.__xq={G:G,S:S,XQ:XQ,newGame:newGame,doMove:doMove,LEVELS:LEVELS};
})();
</script>
